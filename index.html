y:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 17px}.section-head h2{margin:0;font-size:19px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.field,select,textarea{background:#0c1527;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px 11px;outline:none}.field:focus,select:focus,textarea:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px #8b5cf622}.search{min-width:220px;flex:1}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;color:#7f91ad;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;padding:12px 10px;border-bottom:1px solid var(--line)}.table td{padding:14px 10px;border-bottom:1px solid #26344e88;color:#dce6f7}.table tr:last-child td{border-bottom:0}.service{display:flex;align-items:center;gap:10px}.service-logo{width:34px;height:34px;border-radius:10px;background:#283655;display:grid;place-items:center;font-weight:800;color:#c6b6ff}.muted{color:var(--muted)!important}.pill{padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#253149;color:#aab8d0}.pill.active{background:#123a35;color:#55dfb4}.pill.cancelled{background:#482331;color:#ff9aae}.pill.paused{background:#40351d;color:#f7c96a}.actions{display:flex;gap:6px}.link-btn{border:0;background:transparent;color:#a99aff;padding:5px}.empty{padding:35px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:7px}.reminder{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #26344e88}.reminder:last-child{border:0}.datebox{background:#25304a;border-radius:10px;padding:8px 10px;text-align:center;min-width:52px}.datebox b{font-size:17px;display:block}.datebox small{font-size:9px;color:var(--muted);text-transform:uppercase}.reminder-main{flex:1}.reminder-main b{display:block}.reminder-main small{color:var(--muted)}.warning{color:var(--yellow)}.danger-text{color:var(--red)}.recommend{padding:13px;border:1px solid #6c4d2c;background:#2c241b;border-radius:11px;margin-bottom:10px}.recommend b{display:block;margin-bottom:5px}.recommend p{margin:0;color:#c7b99f;font-size:12px;line-height:1.5}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#0d1729;border:1px solid var(--line);border-radius:12px;padding:14px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:20px;margin-top:7px}.bar-row{display:grid;grid-template-columns:110px 1fr 80px;align-items:center;gap:12px;margin:13px 0;font-size:12px}.bar-bg{height:8px;border-radius:10px;background:#253149;overflow:hidden}.bar-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--purple),var(--cyan))}.modal-backdrop{position:fixed;inset:0;background:#020617bb;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.show{display:flex}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#111b2e;border:1px solid #394966;border-radius:18px;padding:22px;box-shadow:0 30px 90px #0009}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:19px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-group{display:grid;gap:6px}.form-group.full{grid-column:1/-1}.form-group label{font-size:11px;color:#a5b3ca;font-weight:600}.form-group input,.form-group select,.form-group textarea{width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.toast{position:fixed;right:22px;bottom:22px;background:#17372f;border:1px solid #28765e;color:#b8ffe5;padding:12px 17px;border-radius:11px;z-index:40;box-shadow:var(--shadow);display:none}.toast.show{display:block;animation:pop .25s}@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.setting-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #26344e88;gap:15px}.setting-row:last-child{border:0}.light{--bg:#eef2fb;--panel:#fff;--panel2:#f4f6fc;--line:#d8deeb;--text:#172238;--muted:#68758b;--shadow:0 12px 30px #52608018;background:radial-gradient(ellipse at 15% -10%,#d8ceff 0,transparent 35%),#eef2fb;color:var(--text)}.light .sidebar{background:#f9faffed}.light .stat,.light .panel,.light .modal{background:#ffffffed}.light .field,.light select,.light textarea,.light .icon-btn,.light .btn:not(.primary){background:#f6f8fd;color:var(--text)}.light .table td{color:#25324a}.light .metric{background:#f5f7fc}.light .recommend{background:#fff8ed}.mobile-menu{display:none}

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M4 7h16M4 12h10M4 17h13"/><circle cx="18" cy="12" r="2"/></svg></div>SubTrack<span style="color:#9b8cff">.</span></div>
  <div class="nav-label">Workspace</div>
  <nav class="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
    <button data-page="subscriptions"><span class="ico">◫</span>My Subscriptions</button>
    <button data-page="renewals"><span class="ico">◷</span>Upcoming Renewals</button>
    <button data-page="analytics"><span class="ico">▥</span>Spending Analytics</button>
    <button data-page="unused"><span class="ico">◉</span>Unused Subscriptions</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings</button>
  </nav>
  <div class="side-bottom"><div class="nav-label">Your account</div><div class="profile"><div class="avatar" id="avatar">Y</div><div><b id="profileName">Your workspace</b><small>Personal account</small></div></div></div>
</aside>
<main class="main">
  <header class="topbar">
    <div style="display:flex;gap:12px;align-items:center"><button class="icon-btn mobile-menu" id="menuBtn">☰</button><div><div class="eyebrow" id="eyebrow">OVERVIEW</div><h1 id="pageTitle">Dashboard</h1></div></div>
    <div class="top-actions"><button class="icon-btn" id="themeBtn" title="Toggle theme">☼</button><button class="btn primary" id="addBtn">＋ Add subscription</button></div>
  </header>
  <div id="pageContent" class="content"></div>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Add subscription</h2><button class="icon-btn" id="closeModal">✕</button></div><form id="subscriptionForm"><input type="hidden" id="editId"><div class="form-grid">
<div class="form-group"><label>Subscription name *</label><input id="name" required placeholder="e.g. Netflix"></div>
<div class="form-group"><label>Service provider</label><input id="provider" placeholder="e.g. Netflix Inc."></div>
<div class="form-group"><label>Category *</label><select id="category" required><option>Entertainment</option><option>Music</option><option>Shopping</option><option>Fitness</option><option>Education</option><option>Software</option><option>Other</option></select></div>
<div class="form-group"><label>Price *</label><input id="price" type="number" min=".01" step=".01" required placeholder="149"></div>
<div class="form-group"><label>Billing cycle *</label><select id="cycle"><option>Monthly</option><option>Quarterly</option><option>Yearly</option><option>Weekly</option></select></div>
<div class="form-group"><label>Payment method</label><select id="payment"><option>UPI</option><option>Credit card</option><option>Debit card</option><option>Net banking</option><option>PayPal</option><option>Other</option></select></div>
<div class="form-group"><label>Start date *</label><input id="startDate" type="date" required></div>
<div class="form-group"><label>Next renewal date *</label><input id="renewalDate" type="date" required></div>
<div class="form-group"><label>Status</label><select id="status"><option>Active</option><option>Paused</option><option>Cancelled</option></select></div>
<div class="form-group"><label>Last used date</label><input id="lastUsed" type="date"></div>
<div class="form-group full"><label>Notes</label><textarea id="notes" rows="2" placeholder="Optional notes..."></textarea></div>
</div><div class="modal-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" type="submit">Save subscription</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const today=new Date();today.setHours(0,0,0,0);
const iso=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayDiff=d=>Math.round((new Date(d+'T00:00:00')-today)/86400000);
const id=()=>Math.random().toString(36).slice(2,10);
let settings=JSON.parse(localStorage.getItem('subtrack_settings')||'{"currency":"INR","theme":"dark","name":"Your workspace","reminders":true}');
let subscriptions=JSON.parse(localStorage.getItem('subtrack_data')||'null');
if(!subscriptions){subscriptions=[
{name:'Netflix Premium',provider:'Netflix',category:'Entertainment',price:649,cycle:'Monthly',startDate:iso(addDays(today,-160)),renewalDate:iso(addDays(today,2)),payment:'UPI',status:'Active',lastUsed:iso(addDays(today,-3)),notes:'Family plan',id:id()},
{name:'Spotify Premium',provider:'Spotify',category:'Music',price:119,cycle:'Monthly',startDate:iso(addDays(today,-240)),renewalDate:iso(addDays(today,8)),payment:'UPI',status:'Active',lastUsed:iso(addDays(today,-1)),notes:'',id:id()},
{name:'Amazon Prime',provider:'Amazon',category:'Shopping',price:1499,cycle:'Yearly',startDate:iso(addDays(today,-80)),renewalDate:iso(addDays(today,17)),payment:'Credit card',status:'Active',lastUsed:iso(addDays(today,-12)),notes:'Annual membership',id:id()},
{name:'YouTube Premium',provider:'Google',category:'Entertainment',price:129,cycle:'Monthly',startDate:iso(addDays(today,-200)),renewalDate:iso(addDays(today,25)),payment:'UPI',status:'Active',lastUsed:iso(addDays(today,-67)),notes:'',id:id()},
{name:'Adobe Creative Cloud',provider:'Adobe',category:'Software',price:1675,cycle:'Monthly',startDate:iso(addDays(today,-300)),renewalDate:iso(addDays(today,5)),payment:'Credit card',status:'Active',lastUsed:iso(addDays(today,-95)),notes:'Design tools',id:id()},
{name:'Cult.fit',provider:'Cult.fit',category:'Fitness',price:999,cycle:'Monthly',startDate:iso(addDays(today,-100)),renewalDate:iso(addDays(today,42)),payment:'UPI',status:'Paused',lastUsed:iso(addDays(today,-75)),notes:'',id:id()},
{name:'Coursera Plus',provider:'Coursera',category:'Education',price:3999,cycle:'Yearly',startDate:iso(addDays(today,-365)),renewalDate:iso(addDays(today,-12)),payment:'Debit card',status:'Cancelled',lastUsed:iso(addDays(today,-140)),notes:'',id:id()}
];save()}
function save(){localStorage.setItem('subtrack_data',JSON.stringify(subscriptions));localStorage.setItem('subtrack_settings',JSON.stringify(settings))}
function money(v){return new Intl.NumberFormat('en-IN',{style:'currency',currency:settings.currency,maximumFractionDigits:settings.currency==='INR'?0:2}).format(v||0)}
function monthly(s){let p=+s.price||0;return p*({'Weekly':52/12,'Monthly':1,'Quarterly':1/3,'Yearly':1/12}[s.cycle]||1)}
function yearly(s){return monthly(s)*12}
function active(){return subscriptions.filter(s=>s.status==='Active')}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function serviceIcon(s){return (s.provider||s.name||'?').trim().slice(0,1).toUpperCase()}
function title(page){let map={dashboard:['OVERVIEW','Dashboard'],subscriptions:['YOUR LIBRARY','My Subscriptions'],renewals:['STAY AHEAD','Upcoming Renewals'],analytics:['YOUR MONEY, CLEARLY','Spending Analytics'],unused:['SMART REVIEW','Unused Subscriptions'],settings:['PREFERENCES','Settings']};$('#eyebrow').textContent=map[page][0];$('#pageTitle').textContent=map[page][1];$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#addBtn').style.display=page==='settings'?'none':'inline-block';$('#sidebar').classList.remove('open')}
let page='dashboard',filters={q:'',cat:'All categories',status:'All statuses',sort:'renewal'};
function go(p){page=p;title(p);render()}
function stat(label,value,foot,icon,glow){return `<div class="stat" style="--glow:${glow}"><div class="stat-head"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function panelHead(a,b=''){return `<div class="panel-head"><div><h3>${a}</h3>${b?`<div class="sub">${b}</div>`:''}</div></div>`}
function empty(msg='Nothing here yet'){return `<div class="empty"><strong>${msg}</strong>Add a subscription to see it here.</div>`}
function tableRows(list){if(!list.length)return `<tr><td colspan="7">${empty('No subscriptions found')}</td></tr>`;return list.map(s=>`<tr><td><div class="service"><div class="service-logo">${serviceIcon(s)}</div><div><b>${esc(s.name)}</b><div class="sub">${esc(s.provider||s.category)}</div></div></div></td><td>${esc(s.category)}</td><td><b>${money(s.price)}</b><div class="sub">${s.cycle}</div></td><td>${s.renewalDate?new Date(s.renewalDate+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—'}</td><td><span class="pill ${s.status.toLowerCase()}">${s.status}</span></td><td>${esc(s.payment||'—')}</td><td><div class="actions"><button class="link-btn" onclick="editSub('${s.id}')">Edit</button><button class="link-btn" onclick="deleteSub('${s.id}')">Delete</button></div></td></tr>`).join('')}
function table(list){return `<div class="table-wrap"><table class="table"><thead><tr><th>Subscription</th><th>Category</th><th>Price</th><th>Next renewal</th><th>Status</th><th>Payment</th><th>Actions</th></tr></thead><tbody>${tableRows(list)}</tbody></table></div>`}
function chartLine(canvasId,values,labels){let c=document.getElementById(canvasId);if(!c)return;let ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);let pad=32,max=Math.max(...values,1)*1.2;ctx.strokeStyle='#293852';ctx.lineWidth=1;for(let i=0;i<4;i++){let y=pad+(h-pad*1.6)*i/3;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-8,y);ctx.stroke()}let pts=values.map((v,i)=>({x:pad+(w-pad-12)*(i/(values.length-1||1)),y:h-pad-(h-pad*1.6)*(v/max)}));let grad=ctx.createLinearGradient(0,pad,0,h);grad.addColorStop(0,'#8b5cf655');grad.addColorStop(1,'#8b5cf600');ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.lineTo(pts.at(-1).x,h-pad);ctx.lineTo(pts[0].x,h-pad);ctx.closePath();ctx.fillStyle=grad;ctx.fill();ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='#9b83ff';ctx.lineWidth=2.5;ctx.stroke();pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,Math.PI*2);ctx.fillStyle='#22d3ee';ctx.fill()});ctx.fillStyle='#8292ad';ctx.font='10px sans-serif';ctx.textAlign='center';labels.forEach((l,i)=>ctx.fillText(l,pts[i].x,h-7))}
function drawDonut(canvasId,items){let c=document.getElementById(canvasId);if(!c)return;let ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);let total=items.reduce((a,x)=>a+x.value,0)||1,colors=['#8b5cf6','#4f8cff','#22d3ee','#34d399','#fbbf24','#fb7185','#a78bfa'];let angle=-Math.PI/2,cx=w/2,cy=h/2,r=Math.min(w,h)*.39;items.forEach((x,i)=>{let end=angle+x.value/total*Math.PI*2;ctx.beginPath();ctx.arc(cx,cy,r,angle,end);ctx.strokeStyle=colors[i%colors.length];ctx.lineWidth=20;ctx.stroke();angle=end});ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--text');ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText(money(total),cx,cy+5);ctx.font='10px sans-serif';ctx.fillStyle='#91a1bb';ctx.fillText('monthly',cx,cy+22)}
function renderDashboard(){let a=active(),m=a.reduce((v,s)=>v+monthly(s),0),y=a.reduce((v,s)=>v+yearly(s),0),up=a.filter(s=>dayDiff(s.renewalDate)>=0&&dayDiff(s.renewalDate)<=30).length,cancel=subscriptions.filter(s=>s.status==='Cancelled').length;let renew=a.filter(s=>dayDiff(s.renewalDate)>=0&&dayDiff(s.renewalDate)<=7).sort((x,y)=>x.renewalDate.localeCompare(y.renewalDate));let cats={};a.forEach(s=>cats[s.category]=(cats[s.category]||0)+monthly(s));let catItems=Object.entries(cats).map(([name,value])=>({name,value})).sort((x,y)=>y.value-x.value);let months=[];for(let i=5;i>=0;i--){let d=new Date(today.getFullYear(),today.getMonth()-i,1);months.push(d.toLocaleDateString('en-IN',{month:'short'}))}let base=m;let vals=months.map((_,i)=>Math.round(base*(.78+.07*i+Math.sin(i*1.5)*.05)));let top=[...a].sort((x,y)=>monthly(y)-monthly(x)).slice(0,4);
$('#pageContent').innerHTML=`<div class="stats">${stat('Active subscriptions',a.length,'Across all categories','◫','#8b5cf6')}${stat('Monthly spending',money(m),'Normalized recurring cost','↗','#4f8cff')}${stat('Yearly spending',money(y),'Projected annual commitment','▤','#22d3ee')}${stat('Upcoming renewals',up,'Within the next 30 days','◷','#fbbf24')}</div>
<div class="grid2"><section class="panel">${panelHead('Monthly expenditure','Estimated recurring spend over the last 6 months')}<div class="chart-wrap"><canvas id="lineChart"></canvas></div><div class="legend"><span><i class="dot" style="background:#9b83ff"></i>Monthly spend</span><span class="muted">Illustrative trend based on current active plans</span></div></section><section class="panel">${panelHead('Spending by category','Monthly normalized cost')}<div class="chart-wrap" style="height:190px"><canvas id="donutChart"></canvas></div><div class="legend">${catItems.map((x,i)=>`<span><i class="dot" style="background:${['#8b5cf6','#4f8cff','#22d3ee','#34d399','#fbbf24','#fb7185','#a78bfa'][i%7]}"></i>${esc(x.name)}</span>`).join('')||'No active spending'}</div></section></div>
<div class="grid2"><section class="panel">${panelHead('Upcoming renewals','Your next payments in the coming week')}${renew.length?renew.map(s=>reminderHTML(s)).join(''):empty('No renewals in the next 7 days')}<div style="margin-top:12px"><button class="link-btn" onclick="go('renewals')">View all reminders →</button></div></section><section class="panel">${panelHead('Most expensive subscriptions','Ranked by monthly equivalent')}${top.map((s,i)=>`<div class="bar-row"><span>${esc(s.name)}</span><div class="bar-bg"><div class="bar-fill" style="width:${Math.max(4,monthly(s)/(monthly(top[0])||1)*100)}%"></div></div><b style="text-align:right">${money(monthly(s))}</b></div>`).join('')||empty()}</section></div>
<div class="panel">${panelHead('Subscription snapshot','A quick look at your active plans')}<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span class="sub">${cancel} cancelled subscription${cancel===1?'':'s'}</span><button class="btn small" onclick="go('subscriptions')">Manage subscriptions →</button></div>${table(a.slice(0,5))}</div>`;
requestAnimationFrame(()=>{chartLine('lineChart',vals,months);drawDonut('donutChart',catItems)})}
function reminderHTML(s){let d=dayDiff(s.renewalDate),date=new Date(s.renewalDate+'T00:00:00');return `<div class="reminder"><div class="datebox"><b>${date.getDate()}</b><small>${date.toLocaleDateString('en-IN',{month:'short'})}</small></div><div class="reminder-main"><b>${esc(s.name)}</b><small>${d===0?'Renews today':d===1?'Renews tomorrow':`Renews in ${d} days`} · ${money(s.price)}</small></div><span class="${d<=1?'danger-text':'warning'}" style="font-size:12px;font-weight:700">${d===0?'Today':d===1?'Tomorrow':`${d} days`}</span><button class="link-btn" title="Mark reminder completed" onclick="completeReminder('${s.id}')">✓</button></div>`}
function renderSubscriptions(){let list=subscriptions.filter(s=>(s.name+' '+s.provider).toLowerCase().includes(filters.q.toLowerCase())&&(filters.cat==='All categories'||s.category===filters.cat)&&(filters.status==='All statuses'||s.status===filters.status));list.sort((a,b)=>filters.sort==='price'?monthly(b)-monthly(a):filters.sort==='name'?a.name.localeCompare(b.name):a.renewalDate.localeCompare(b.renewalDate));$('#pageContent').innerHTML=`<div class="section-head"><div><h2>All your subscriptions</h2><div class="sub">${subscriptions.length} total records · Manage recurring payments in one place</div></div><button class="btn primary" onclick="openModal()">＋ Add subscription</button></div><div class="panel"><div class="toolbar"><input class="field search" id="search" placeholder="⌕ Search subscriptions..." value="${esc(filters.q)}"><select id="catFilter"><option>All categories</option>${['Entertainment','Music','Shopping','Fitness','Education','Software','Other'].map(x=>`<option ${filters.cat===x?'selected':''}>${x}</option>`).join('')}</select><select id="statusFilter">${['All statuses','Active','Paused','Cancelled'].map(x=>`<option ${filters.status===x?'selected':''}>${x}</option>`).join('')}</select><select id="sortFilter"><option value="renewal" ${filters.sort==='renewal'?'selected':''}>Sort: renewal date</option><option value="price" ${filters.sort==='price'?'selected':''}>Sort: highest price</option><option value="name" ${filters.sort==='name'?'selected':''}>Sort: name</option></select></div><div id="subscriptionTable">${table(list)}</div></div><div class="grid3">${stat('Active',subscriptions.filter(s=>s.status==='Active').length,'Currently running','●','#34d399')}${stat('Paused',subscriptions.filter(s=>s.status==='Paused').length,'Temporarily on hold','Ⅱ','#fbbf24')}${stat('Cancelled',subscriptions.filter(s=>s.status==='Cancelled').length,'No longer renewing','×','#fb7185')}</div>`;$('#search').addEventListener('input',e=>{filters.q=e.target.value;updateTable()});['catFilter','statusFilter','sortFilter'].forEach(k=>$('#'+k).addEventListener('change',e=>{if(k==='catFilter')filters.cat=e.target.value;if(k==='statusFilter')filters.status=e.target.value;if(k==='sortFilter')filters.sort=e.target.value;updateTable()}))}
function updateTable(){let list=subscriptions.filter(s=>(s.name+' '+s.provider).toLowerCase().includes(filters.q.toLowerCase())&&(filters.cat==='All categories'||s.category===filters.cat)&&(filters.status==='All statuses'||s.status===filters.status));list.sort((a,b)=>filters.sort==='price'?monthly(b)-monthly(a):filters.sort==='name'?a.name.localeCompare(b.name):a.renewalDate.localeCompare(b.renewalDate));$('#subscriptionTable').innerHTML=table(list)}
function renderRenewals(){let a=active().filter(s=>dayDiff(s.renewalDate)>=0&&dayDiff(s.renewalDate)<=30).sort((x,y)=>x.renewalDate.localeCompare(y.renewalDate));let week=a.filter(s=>dayDiff(s.renewalDate)<=7),later=a.filter(s=>dayDiff(s.renewalDate)>7);$('#pageContent').innerHTML=`<div class="stats">${stat('Next 7 days',week.length,'Immediate renewals','◷','#fb7185')}${stat('Next 30 days',a.length,'All upcoming payments','▦','#fbbf24')}${stat('Due tomorrow',a.filter(s=>dayDiff(s.renewalDate)===1).length,'Prepare for these charges','!','#4f8cff')}${stat('Payment total',money(a.reduce((v,s)=>v+(+s.price),0)),'Upcoming listed charges','₹','#8b5cf6')}</div><div class="grid2"><section class="panel">${panelHead('Next 7 days','Payments that need your attention')}${week.map(reminderHTML).join('')||empty('You are all caught up')}</section><section class="panel">${panelHead('Later this month','Renewals due in 8–30 days')}${later.map(reminderHTML).join('')||empty('No later renewals')}</section></div><div class="panel">${panelHead('Reminder preferences','Reminders are calculated from each next renewal date')}<div class="setting-row"><div><b>Upcoming payment alerts</b><div class="sub">Show renewal reminders in your dashboard</div></div><input type="checkbox" id="reminderToggle" ${settings.reminders?'checked':''}></div><div class="sub">Reminder completion is a session-level acknowledgement; your renewal date remains unchanged.</div></div>`;$('#reminderToggle').onchange=e=>{settings.reminders=e.target.checked;save();toast('Reminder preferences updated')}}
function renderAnalytics(){let a=active(),m=a.reduce((v,s)=>v+monthly(s),0),y=m*12,avg=a.length?m/a.length:0,cats={};a.forEach(s=>cats[s.category]=(cats[s.category]||0)+monthly(s));let top=Object.entries(cats).sort((x,y)=>y[1]-x[1])[0],exp=[...a].sort((x,y)=>monthly(y)-monthly(x))[0];let months=[];for(let i=5;i>=0;i--){let d=new Date(today.getFullYear(),today.getMonth()-i,1);months.push(d.toLocaleDateString('en-IN',{month:'short'}))}let vals=months.map((_,i)=>Math.round(m*(.78+.07*i+Math.sin(i*1.5)*.05)));$('#pageContent').innerHTML=`<div class="metric-grid">${[['Monthly expenditure',money(m)],['Yearly projection',money(y)],['Average monthly cost',money(avg)],['Highest category',top?top[0]:'—'],['Most expensive plan',exp?exp.name:'—'],['Active subscriptions',a.length]].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${esc(x[1])}</strong></div>`).join('')}</div><div class="grid2"><section class="panel">${panelHead('Spending trend','6-month estimated monthly spend · normalized from current plans')}<div class="chart-wrap"><canvas id="analyticsLine"></canvas></div></section><section class="panel">${panelHead('Category breakdown','Monthly equivalent')} ${Object.entries(cats).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<div class="bar-row"><span>${esc(k)}</span><div class="bar-bg"><div class="bar-fill" style="width:${v/(m||1)*100}%"></div></div><b style="text-align:right">${money(v)}</b></div>`).join('')||empty()}</section></div><div class="panel">${panelHead('Monthly vs annual commitment','Annual values are calculated from billing frequency')}<div class="grid2"><div class="metric"><small>Monthly commitment</small><strong>${money(m)}</strong><div class="sub">Active subscriptions normalized to a month</div></div><div class="metric"><small>Annual commitment</small><strong>${money(y)}</strong><div class="sub">Monthly commitment × 12</div></div></div></div><div class="panel">${panelHead('Cost by subscription','Sorted by monthly equivalent')}${table([...a].sort((x,y)=>monthly(y)-monthly(x)))}</div>`;requestAnimationFrame(()=>chartLine('analyticsLine',vals,months))}
function renderUnused(){let a=active().map(s=>({...s,unused:s.lastUsed?Math.floor((today-new Date(s.lastUsed+'T00:00:00'))/86400000):9999})).filter(s=>s.unused>=30).sort((x,y)=>y.unused-x.unused),saving=a.reduce((v,s)=>v+yearly(s),0);$('#pageContent').innerHTML=`<div class="stats">${stat('Needs review',a.length,'Unused for 30+ days','◉','#fbbf24')}${stat('Potential annual savings',money(saving),'If all flagged plans are cancelled','↗','#34d399')}${stat('60+ days unused',a.filter(s=>s.unused>=60).length,'Consider whether you still need them','!','#fb7185')}${stat('90+ days unused',a.filter(s=>s.unused>=90).length,'Strong candidates for review','◎','#8b5cf6')}</div><div class="panel">${panelHead('Subscription health check','Based on the last-used date you record. Update it when you use a service.')}${a.length?a.map(s=>`<div class="recommend"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><b>${esc(s.name)} <span class="pill ${s.unused>=90?'cancelled':s.unused>=60?'paused':'active'}">${s.unused>=90?'90+ days':s.unused>=60?'60+ days':'30+ days'} unused</span></b><b>${money(yearly(s))}/yr</b></div><p>You haven't used this subscription for ${s.unused} days. Consider cancelling it to save approximately ${money(yearly(s))} per year.</p><div style="display:flex;gap:8px;margin-top:10px"><button class="btn small" onclick="markUsed('${s.id}')">Mark as used today</button><button class="btn small" onclick="editSub('${s.id}')">Update details</button><button class="btn small danger" onclick="cancelSub('${s.id}')">Cancel subscription</button></div></div>`).join(''):`${empty('Great job — no unused subscriptions flagged')}`}<div class="sub">Savings estimate assumes the subscription stays cancelled for a full year. It is an estimate, not a refund calculation.</div></div>`}
function renderSettings(){$('#pageContent').innerHTML=`<div class="settings-grid"><section class="panel">${panelHead('Profile','Personalize your SubTrack workspace')}<div class="form-group"><label>Display name</label><input class="field" id="settingName" value="${esc(settings.name)}"></div><div class="setting-row"><div><b>Account type</b><div class="sub">Local demo workspace</div></div><span class="pill active">Personal</span></div><button class="btn primary" id="saveProfile" style="margin-top:14px">Save profile</button></section><section class="panel">${panelHead('Preferences','Control how SubTrack looks and behaves')}<div class="setting-row"><div><b>Currency</b><div class="sub">Used for all prices and analytics</div></div><select id="currency"><option value="INR">INR — ₹</option><option value="USD">USD — $</option><option value="EUR">EUR — €</option><option value="GBP">GBP — £</option><option value="AED">AED</option></select></div><div class="setting-row"><div><b>Appearance</b><div class="sub">Choose your preferred theme</div></div><select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></div><div class="setting-row"><div><b>Renewal reminders</b><div class="sub">Show reminders for upcoming payments</div></div><input id="settingsReminders" type="checkbox" ${settings.reminders?'checked':''}></div></section><section class="panel">${panelHead('Data & privacy','Your data stays in this browser')}<p class="sub" style="line-height:1.7">This standalone version stores subscription records in your browser using localStorage. No account server or cloud sync is connected. Export a backup regularly if you use this as your personal tracker.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="exportBtn">↓ Export CSV</button><button class="btn" id="importBtn">↑ Import CSV</button><input type="file" id="importFile" accept=".csv,text/csv" hidden></div></section><section class="panel">${panelHead('Demo data','Reset or clear your local workspace')}<p class="sub">Sample subscriptions are included so you can explore the dashboard immediately.</p><button class="btn danger" id="clearData">Delete all subscription data</button></section></div>`;$('#currency').value=settings.currency;$('#theme').value=settings.theme;$('#saveProfile').onclick=()=>{settings.name=$('#settingName').value.trim()||'Your workspace';save();updateProfile();toast('Profile saved')};$('#currency').onchange=e=>{settings.currency=e.target.value;save();render();toast('Currency updated')};$('#theme').onchange=e=>setTheme(e.target.value);$('#settingsReminders').onchange=e=>{settings.reminders=e.target.checked;save()};$('#exportBtn').onclick=exportCSV;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=importCSV;$('#clearData').onclick=()=>{if(confirm('Delete all subscription records from this browser?')){subscriptions=[];save();render();toast('All records deleted')}}}
function render(){if(page==='dashboard')renderDashboard();if(page==='subscriptions')renderSubscriptions();if(page==='renewals')renderRenewals();if(page==='analytics')renderAnalytics();if(page==='unused')renderUnused();if(page==='settings')renderSettings();updateProfile()}
function updateProfile(){$('#profileName').textContent=settings.name;$('#avatar').textContent=(settings.name||'Y').trim().charAt(0).toUpperCase()}
function setTheme(t){settings.theme=t;document.body.classList.toggle('light',t==='light');save();if($('#theme'))$('#theme').value=t;render();toast('Theme updated')}
function openModal(s){$('#subscriptionForm').reset();$('#editId').value=s?.id||'';$('#modalTitle').textContent=s?'Edit subscription':'Add subscription';$('#name').value=s?.name||'';$('#provider').value=s?.provider||'';$('#category').value=s?.category||'Entertainment';$('#price').value=s?.price??'';$('#cycle').value=s?.cycle||'Monthly';$('#payment').value=s?.payment||'UPI';$('#startDate').value=s?.startDate||iso(today);$('#renewalDate').value=s?.renewalDate||iso(addDays(today,30));$('#status').value=s?.status||'Active';$('#lastUsed').value=s?.lastUsed||'';$('#notes').value=s?.notes||'';$('#modalBackdrop').classList.add('show')}
function closeModal(){$('#modalBackdrop').classList.remove('show')}
function editSub(x){let s=subscriptions.find(z=>z.id===x);if(s)openModal(s)}
function deleteSub(x){let s=subscriptions.find(z=>z.id===x);if(s&&confirm(`Delete ${s.name}? This cannot be undone.`)){subscriptions=subscriptions.filter(z=>z.id!==x);save();render();toast('Subscription deleted')}}
function cancelSub(x){let s=subscriptions.find(z=>z.id===x);if(s){s.status='Cancelled';save();render();toast('Subscription marked as cancelled')}}
function markUsed(x){let s=subscriptions.find(z=>z.id===x);if(s){s.lastUsed=iso(today);save();render();toast('Last-used date updated')}}
function completeReminder(x){let s=subscriptions.find(z=>z.id===x);if(s){s.reminderDone=true;toast('Reminder marked as reviewed')}}
$('#subscriptionForm').onsubmit=e=>{e.preventDefault();let obj={id:$('#editId').value||id(),name:$('#name').value.trim(),provider:$('#provider').value.trim(),category:$('#category').value,price:+$('#price').value,cycle:$('#cycle').value,startDate:$('#startDate').value,renewalDate:$('#renewalDate').value,payment:$('#payment').value,status:$('#status').value,lastUsed:$('#lastUsed').value,notes:$('#notes').value.trim()};if(!obj.name||!obj.price||obj.price<=0||!obj.startDate||!obj.renewalDate){toast('Please complete all required fields with valid values');return}if(obj.renewalDate<obj.startDate){toast('Renewal date cannot be before the start date');return}let i=subscriptions.findIndex(s=>s.id===obj.id);if(i>=0)subscriptions[i]=obj;else subscriptions.push(obj);save();closeModal();render();toast(i>=0?'Subscription updated':'Subscription added successfully')};
function exportCSV(){let cols=['name','provider','category','price','cycle','startDate','renewalDate','payment','status','lastUsed','notes'];let csv=[cols.join(','),...subscriptions.map(s=>cols.map(k=>'"'+String(s[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='subtrack-subscriptions.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV export downloaded')}
function importCSV(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let lines=r.result.split(/\r?\n/).filter(Boolean),headers=lines.shift().split(',').map(x=>x.replace(/^"|"$/g,''));let rows=lines.map(line=>{let vals=[],cur='',q=false;for(let i=0;i<line.length;i++){if(line[i]==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(line[i]===','&&!q){vals.push(cur);cur=''}else cur+=line[i]}vals.push(cur);return Object.fromEntries(headers.map((h,i)=>[h,vals[i]||'']))});rows.forEach(s=>{s.id=id();s.price=+s.price||0;s.status=s.status||'Active'});subscriptions.push(...rows.filter(s=>s.name&&s.price>0));save();render();toast(`${rows.length} CSV rows processed`)}catch(err){toast('Could not read this CSV file')}};r.readAsText(f);e.target.value=''}
$$('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#addBtn').onclick=()=>openModal();$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};$('#themeBtn').onclick=()=>setTheme(settings.theme==='dark'?'light':'dark');$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
document.body.classList.toggle('light',settings.theme==='light');title('dashboard');render();
window.addEventListener('resize',()=>{if(page==='dashboard')renderDashboard();if(page==='analytics')renderAnalytics()});
</script>
</body></html>
